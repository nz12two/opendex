name: Atualizar Dados

on:
  schedule:
    # Roda a cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Permite execução manual

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Buscar dados atualizados do ecossistema (coletores modulares)
        run: node scripts/update-ecosystem-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Verificar mudanças
        id: changes
        run: |
          if git diff --quiet src/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit e push das atualizações
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "opendex-bot"
          git config user.email "bot@opendex.dev"
          git add src/data/
          git commit -m "chore(data): atualização automática de dados [skip ci]"
          git push
